<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px;
        }

        .form-box {
            width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background: #5a67d8;
        }

        .clear-btn {
            background: red;
        }

        .clear-btn:hover {
            background: darkred;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e6fffa;
            border-left: 5px solid green;
        }
    </style>
</head>

<body>

<div class="form-box">
    <h2>Student Registration Form</h2>

    <form method="post">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name" value="{{ name }}">

        <label>Email:</label>
        <input type="email" name="email" value="{{ email }}">

        <label>Mobile Number:</label>
        <input type="text" name="phone" value="{{ phone }}">

        <label>Gender:</label>
        <select name="gender">
            <option value="">Select</option>
            <option value="Male" {% if gender == "Male" %}selected{% endif %}>Male</option>
            <option value="Female" {% if gender == "Female" %}selected{% endif %}>Female</option>
        </select>

        <label>Date of Birth:</label>
        <input type="date" name="dob" value="{{ dob }}">

        <label>Course:</label>
        <select name="course">
            <option value="BCA" {% if course == "BCA" %}selected{% endif %}>BCA</option>
            <option value="B.Tech" {% if course == "B.Tech" %}selected{% endif %}>B.Tech</option>
            <option value="BBA" {% if course == "BBA" %}selected{% endif %}>BBA</option>
        </select>

        <label>Address:</label>
        <textarea name="address">{{ address }}</textarea>

        <!-- Buttons -->
        <button type="submit">Submit</button>
<a href="/">
    <button type="button" class="clear-btn">Clear</button>
</a>
    </form>

    <!-- Output -->
    {% if name and email %}
    <div class="result">
        <h3>Submitted Data:</h3>
        <p>Name: {{ name }}</p>
        <p>Email: {{ email }}</p>
        <p>Phone: {{ phone }}</p>
        <p>Gender: {{ gender }}</p>
        <p>DOB: {{ dob }}</p>
        <p>Course: {{ course }}</p>
        <p>Address: {{ address }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
